<style>
@font-face {
  font-family: 'Big Shoulders';
  font-style: normal; font-display: swap; font-weight: 100 900;
  src: url(big-shoulders-display-latin-ext-wght-normal.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Big Shoulders';
  font-style: normal; font-display: swap; font-weight: 100 900;
  src: url(big-shoulders-display-latin-wght-normal.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* Chalk (light) — the default identity */
:root {
  --bg: #EDEFF1;
  --surface: #FFFFFF;
  --surface-2: #E2E5E9;
  --ink: #22262D;
  --ink-2: #5A626E;
  --steel: #8A919B;
  --line: rgba(34, 38, 45, .10);
  --red: #DF2F28;
  --blue: #1E6BDB;
  --yellow: #E8AC00;
  --yellow-ink: #9A7200;
  --green: #17955A;
  --water: #1FA3D1;
  --on-accent: #FFFFFF;
  --seg-on: #FFFFFF;
  --shadow: 0 1px 0 rgba(34, 38, 45, .06);
  --display: 'Big Shoulders', 'Arial Narrow', system-ui, sans-serif;
  --text: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
/* Rubber floor (dark) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1D22; --surface: #24282F; --surface-2: #30353D; --ink: #EEF0F2; --ink-2: #A8AFB9; --steel: #7E8692;
    --line: rgba(255, 255, 255, .08); --red: #FF4B3E; --blue: #4C8EFF; --yellow: #FFC21A; --yellow-ink: #FFC21A;
    --green: #2FC27A; --water: #5ACDF4; --shadow: none; --seg-on: #4A515C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1D22; --surface: #24282F; --surface-2: #30353D; --ink: #EEF0F2; --ink-2: #A8AFB9; --steel: #7E8692;
  --line: rgba(255, 255, 255, .08); --red: #FF4B3E; --blue: #4C8EFF; --yellow: #FFC21A; --yellow-ink: #FFC21A;
  --green: #2FC27A; --water: #5ACDF4; --shadow: none; --seg-on: #4A515C; color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { transition: background-color .25s; margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.4; overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* App shell: the tab bar is a normal flex child, never position:fixed (iOS keyboard bug) */
#app { position: relative; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
#view { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.screen { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 16px 28px; }

#tabbar { flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(env(safe-area-inset-bottom) + 4px); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--steel); font-size: 11px; font-weight: 600; position: relative; min-height: 48px; justify-content: center; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--red); }
.tab .dot { position: absolute; top: 4px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid var(--surface); }

/* Type */
.h-title { font-family: var(--display); font-weight: 800; font-size: 42px; line-height: .95; letter-spacing: .2px; margin: 0; }
.h-sec { font-family: var(--display); font-weight: 750; font-size: 26px; line-height: 1; margin: 30px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.h-sec .btn { font-family: var(--text); font-weight: 650; }
.h-sec .aside { font-family: var(--text); font-size: 14px; font-weight: 500; color: var(--ink-2); }
.date-line { color: var(--ink-2); font-size: 15px; margin-bottom: 4px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.num { font-family: var(--display); font-weight: 750; font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; display: inline-grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 24px; height: 24px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 650; font-size: 16px; transition: transform .08s; }
.btn:active { transform: scale(.98); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--red); color: var(--on-accent); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.ghost { background: var(--surface-2); }
.btn.text { min-height: 44px; padding: 0 8px; color: var(--ink-2); }
.btn.danger { color: var(--red); }
.btn.wide { width: 100%; }
.btn.big { min-height: 58px; font-size: 18px; border-radius: 16px; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn[disabled] { opacity: .45; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 38px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Grouped list (iOS-style) */
.group { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 52px; width: 100%; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 600; }
.row .meta { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .end { text-align: right; flex: none; }
.row button.row, button.row:active { background: none; }
button.row:active { background: var(--surface-2); }
.empty { padding: 22px 16px; color: var(--ink-2); text-align: center; font-size: 15px; }

/* Today: fuel hero */
.fuel { margin-top: 22px; }
.kcal { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kcal-big { font-family: var(--display); font-weight: 850; font-size: 88px; line-height: .85; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.kcal-unit { font-size: 17px; font-weight: 650; }
.kcal-sub { color: var(--ink-2); font-size: 15px; margin-top: 8px; }
.kbar { height: 10px; border-radius: 6px; background: var(--surface-2); margin-top: 12px; overflow: hidden; }
.kbar > i { display: block; height: 100%; background: var(--red); border-radius: 6px; transition: width .5s; }

/* Bumper plates seen edge-on, loaded on a bar */
.rack { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 22px; padding: 0 14px; }
.rack::before { content: ''; position: absolute; left: 0; right: 0; top: 63px; height: 8px; border-radius: 4px; background: linear-gradient(var(--steel), color-mix(in srgb, var(--steel) 70%, var(--bg))); z-index: 0; }
.rack::after { content: ''; position: absolute; left: 4px; right: 4px; top: 56px; height: 22px; border-left: 6px solid var(--steel); border-right: 6px solid var(--steel); border-radius: 3px; z-index: 0; pointer-events: none; }
.plate-col { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.plate { position: relative; width: 100%; max-width: 76px; height: 134px; border-radius: 12px; overflow: hidden; background: color-mix(in srgb, var(--pc) 16%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 35%, transparent); }
.plate .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--pc); transition: height .6s cubic-bezier(.2,.8,.2,1); }
.plate::after { content: ''; position: absolute; inset: 7px 0; border-top: 2px solid rgba(255,255,255,.22); border-bottom: 2px solid rgba(0,0,0,.10); pointer-events: none; }
.plate .over { position: absolute; top: 6px; left: 0; right: 0; text-align: center; color: var(--on-accent); font-weight: 800; font-size: 13px; }
.plate-val { margin-top: 10px; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.plate-val small { font-family: var(--text); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.plate-lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }
.pc-protein { --pc: var(--blue); }
.pc-carbs { --pc: var(--yellow); }
.pc-fat { --pc: var(--green); }
.pc-water { --pc: var(--water); }
.pc-kcal { --pc: var(--red); }

/* Coach card */
.coach { margin-top: 26px; background: var(--ink); color: var(--bg); border-radius: 20px; padding: 18px 18px 14px; position: relative; overflow: hidden; }
.coach::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--cc, var(--red)); }
.coach .who { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; opacity: .75; }
.coach .who svg { width: 18px; height: 18px; }
.coach h3 { font-family: var(--display); font-weight: 800; font-size: 27px; line-height: 1; margin: 10px 0 8px; }
.coach p { margin: 0; font-size: 15px; line-height: 1.45; opacity: .9; }
.coach .acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.coach .btn.ghost { background: color-mix(in srgb, var(--bg) 14%, transparent); color: var(--bg); }
.cat-train { --cc: var(--red); }
.cat-food { --cc: var(--blue); }
.cat-recover { --cc: var(--green); }
.cat-water { --cc: var(--water); }

/* Cards */
.card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.card h3 { margin: 0; font-size: 17px; }
.mt { margin-top: 12px; }
.mt2 { margin-top: 22px; }

.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.qt { background: var(--surface); border-radius: 18px; padding: 12px 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; min-height: 92px; text-align: left; box-shadow: var(--shadow); font-weight: 650; font-size: 14px; line-height: 1.2; }
.qt svg { width: 26px; height: 26px; }
.qt:active { background: var(--surface-2); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; text-align: center; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.wd .disc { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--on-accent); }
.wd .disc svg { width: 16px; height: 16px; }
.wd.trained .disc { background: var(--red); }
.wd.today { color: var(--ink); }
.wd.today .disc { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.wd .pbar { width: 22px; height: 4px; border-radius: 2px; background: var(--surface-2); }
.wd .pbar.hit { background: var(--blue); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }

.start-card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.start-card .label { color: var(--ink-2); font-size: 14px; }
.start-card .what { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; margin: 4px 0 4px; }
.start-card .list { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }

/* Train */
.tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tpl { position: relative; background: var(--surface); border-radius: 18px; padding: 14px 14px 12px; text-align: left; min-height: 118px; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.tpl:active { background: var(--surface-2); }
.tpl .name { font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1; padding-right: 30px; }
.tpl .exs { font-size: 13px; color: var(--ink-2); margin-top: 8px; line-height: 1.35; flex: 1; }
.tpl .when { font-size: 12px; color: var(--steel); margin-top: 8px; font-weight: 600; }
.tpl .more { position: absolute; top: 4px; right: 4px; width: 40px; height: 40px; display: grid; place-items: center; color: var(--steel); }
.tpl .more svg { width: 20px; height: 20px; }

.wo-head { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -16px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line); }
.wo-head .line1 { display: flex; align-items: center; gap: 10px; }
.wo-name { flex: 1; min-width: 0; font-family: var(--display); font-weight: 800; font-size: 30px; border: 0; background: none; padding: 0; outline: none; }
.wo-meta { font-size: 14px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.rest { display: flex; align-items: center; gap: 8px; margin-top: 10px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 6px 6px 6px 14px; }
.rest .t { font-family: var(--display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; flex: 1; }
.rest .t small { font-family: var(--text); font-size: 13px; font-weight: 600; opacity: .7; margin-right: 6px; }
.rest button { min-height: 38px; padding: 0 12px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 16%, transparent); font-weight: 650; font-size: 14px; }
.rest .bar { position: relative; height: 4px; }

.ex-block { background: var(--surface); border-radius: 20px; padding: 14px 12px 6px; margin-top: 12px; box-shadow: var(--shadow); }
.ex-top { display: flex; align-items: flex-start; gap: 8px; padding: 0 4px; }
.ex-top h3 { margin: 0; font-size: 18px; line-height: 1.2; }
.ex-top .tag { font-size: 13px; color: var(--ink-2); }
.hint { margin: 8px 4px 6px; font-size: 13.5px; line-height: 1.35; color: var(--ink-2); }
.hint b { color: var(--ink); font-weight: 650; }
.hint.go b { color: var(--green); }
.sets { display: grid; grid-template-columns: 34px 1fr 76px 64px 46px; gap: 6px 6px; align-items: center; }
.sets .hd { font-size: 12px; color: var(--steel); font-weight: 600; text-align: center; padding-top: 4px; }
.sets .hd.l { text-align: left; }
.set-n { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--ink-2); background: var(--surface-2); }
.set-prev { font-size: 14px; color: var(--steel); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sets input { width: 100%; height: 44px; border-radius: 11px; border: 0; background: var(--surface-2); text-align: center; font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; outline: none; padding: 0 4px; }
.sets input::placeholder { color: var(--steel); font-weight: 500; }
.sets input:focus { box-shadow: inset 0 0 0 2px var(--blue); }
.check { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); color: var(--steel); display: grid; place-items: center; }
.check svg { width: 22px; height: 22px; }
.sets .done-row { background: transparent; }
.check.on { background: var(--green); color: #fff; }
.set-n.on { background: color-mix(in srgb, var(--green) 20%, var(--surface)); color: var(--green); }
.set-n.pr { background: var(--yellow); color: #3a2b00; }
input.on { background: color-mix(in srgb, var(--green) 12%, var(--surface)) !important; }
.ex-foot { display: flex; justify-content: space-between; margin-top: 4px; }

/* Eat */
.daynav { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; background: var(--surface); border-radius: 14px; padding: 2px; }
.daynav .d { font-weight: 650; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
.mbar .lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; display: flex; justify-content: space-between; }
.mbar .track { height: 8px; background: var(--surface-2); border-radius: 4px; margin-top: 6px; overflow: hidden; }
.mbar .track i { display: block; height: 100%; background: var(--pc); border-radius: 4px; }
.mbar .v { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.mbar .v small { font-family: var(--text); font-size: 12px; color: var(--ink-2); font-weight: 600; }
.water { display: flex; align-items: center; gap: 12px; }
.glasses { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.glass { width: 16px; height: 22px; border-radius: 3px 3px 5px 5px; border: 2px solid color-mix(in srgb, var(--water) 55%, transparent); position: relative; overflow: hidden; }
.glass.full { background: var(--water); border-color: var(--water); }
.meal-h { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 2px 8px; }
.meal-h h2 { font-family: var(--display); font-weight: 800; font-size: 24px; margin: 0; line-height: 1; }
.meal-h .k { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.food-r .k { font-weight: 700; font-variant-numeric: tabular-nums; }
.food-r .pp { font-size: 12.5px; color: var(--ink-2); }
.add-row { color: var(--red); font-weight: 650; }
.add-row svg { width: 20px; height: 20px; }

/* Progress */
.stat-big { font-family: var(--display); font-weight: 850; font-size: 56px; line-height: .9; font-variant-numeric: tabular-nums; }
.stat-big small { font-family: var(--text); font-size: 16px; font-weight: 650; margin-left: 4px; }
.chart { width: 100%; height: auto; display: block; margin-top: 12px; overflow: visible; }
.chart text { font-family: var(--text); font-size: 10px; fill: var(--steel); }
.mrow { display: grid; grid-template-columns: 92px 1fr 30px; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
.mrow .n { font-weight: 600; }
.mrow .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.mtrack { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.mtrack .zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--green) 22%, transparent); }
.mtrack i { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 3px; background: var(--ink); }
.mtrack i.low { background: var(--yellow); }
.mtrack i.ok { background: var(--green); }
.mtrack i.high { background: var(--red); }

/* Coach tab */
details.tip { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
details.tip + details.tip { margin-top: 8px; }
details.tip summary { list-style: none; padding: 14px 16px; font-weight: 650; display: flex; align-items: center; gap: 12px; cursor: pointer; }
details.tip summary::-webkit-details-marker { display: none; }
details.tip summary i { width: 8px; height: 8px; border-radius: 50%; background: var(--cc); flex: none; }
details.tip p { margin: 0; padding: 0 16px 16px 36px; color: var(--ink-2); font-size: 15px; }
.ctx { background: var(--surface); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); border-left: 6px solid var(--cc); }
.ctx + .ctx { margin-top: 10px; }
.ctx h3 { margin: 0 0 4px; font-size: 17px; }
.ctx p { margin: 0; font-size: 15px; color: var(--ink-2); }
.ctx .acts { display: flex; gap: 8px; margin-top: 10px; }

/* Sheets — positioned inside #app (absolute), not fixed */
#sheets { position: absolute; inset: 0; pointer-events: none; z-index: 50; }
.sheet-wrap { position: absolute; inset: 0; pointer-events: auto; isolation: isolate; z-index: 0; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(10, 12, 16, .45); opacity: 0; transition: opacity .2s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - env(safe-area-inset-top) - 24px); background: var(--bg); border-radius: 24px 24px 0 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); padding: 8px 16px calc(env(safe-area-inset-bottom) + 20px); max-width: 640px; margin: 0 auto; }
.sheet.full { top: calc(env(safe-area-inset-top) + 24px); }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-2); margin: 0 auto 6px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: -8px; background: var(--bg); z-index: 2; padding: 6px 0 8px; margin-bottom: 4px; }
.sheet-h h2 { font-family: var(--display); font-weight: 800; font-size: 30px; margin: 0; line-height: 1; }

.field { display: block; margin-top: 14px; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 2px 6px; }
.input, .select { width: 100%; height: 48px; border-radius: 13px; border: 0; background: var(--surface); padding: 0 14px; font-size: 17px; outline: none; box-shadow: inset 0 0 0 1px var(--line); appearance: none; -webkit-appearance: none; }
.input:focus, .select:focus { box-shadow: inset 0 0 0 2px var(--blue); }
.select { background-image: linear-gradient(45deg, transparent 50%, var(--steel) 50%), linear-gradient(135deg, var(--steel) 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid2 .field, .grid3 .field, .grid4 .field { margin-top: 14px; }

.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 14px; width: 20px; height: 20px; color: var(--steel); }
.search .input { padding-left: 42px; }
.sub-h { font-size: 14px; font-weight: 650; color: var(--ink-2); margin: 18px 2px 8px; }
.picked { color: var(--green); }
.picked svg { width: 22px; height: 22px; }
.portion-macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.pm { background: var(--surface); border-radius: 14px; padding: 10px; text-align: center; }
.pm .v { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.pm .l { font-size: 12px; color: var(--ink-2); font-weight: 600; margin-top: 4px; }
.pm.kc .v { color: var(--red); } .pm.pr .v { color: var(--blue); } .pm.cb .v { color: var(--yellow-ink); } .pm.ft .v { color: var(--green); }
.sticky-foot { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); background: var(--bg); padding: 12px 0 calc(env(safe-area-inset-bottom) + 20px); margin-bottom: calc(-20px - env(safe-area-inset-bottom)); z-index: 2; }

.summary-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.summary-stats .pm .v { color: var(--ink); }
.pr-line { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.pr-line + .pr-line { border-top: 1px solid var(--line); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--yellow); color: #3a2b00; }

/* Toasts — absolute inside #app, top edge */
#toasts { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 8px); z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 12px; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 16px; font-size: 15px; font-weight: 600; max-width: 520px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.25); transform: translateY(-16px); opacity: 0; transition: transform .25s, opacity .25s; display: flex; align-items: center; gap: 10px; }
.toast.show { transform: none; opacity: 1; }
.toast .grow { flex: 1; }
.toast button { font-weight: 700; color: var(--bg); opacity: .85; padding: 6px 8px; }
.toast.coachpop { display: block; border-left: 6px solid var(--cc, var(--red)); }
.toast.coachpop .who { font-size: 13px; opacity: .7; }
.toast.coachpop h4 { margin: 4px 0; font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.05; }
.toast.coachpop p { margin: 0; font-weight: 500; font-size: 14px; opacity: .9; }
.toast.coachpop .acts { display: flex; justify-content: flex-end; gap: 4px; margin-top: 6px; }

#err { display: none; position: absolute; left: 0; right: 0; top: 0; z-index: 99; background: #B3261E; color: #fff; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; font-size: 13px; }
#err.on { display: flex; gap: 8px; align-items: center; }
#err .msg { flex: 1; word-break: break-word; }
#err button { background: #fff; color: #B3261E; border-radius: 8px; padding: 6px 10px; font-weight: 700; }

.foot-note { text-align: center; color: var(--steel); font-size: 12.5px; margin-top: 24px; line-height: 1.5; }
/* Photo logging */
.add-split { padding: 0 6px 0 16px; }
.add-split .add-row { flex: 1; display: flex; align-items: center; gap: 12px; min-height: 52px; text-align: left; font-weight: 650; color: var(--red); }
.photo-pick { display: grid; gap: 10px; }
.photo-prev { display: block; width: 100%; max-height: 160px; object-fit: cover; border-radius: 18px; margin-top: 14px; background: var(--surface-2); }
.ai-wait { display: flex; align-items: center; gap: 12px; justify-content: center; padding: 22px 0; font-weight: 600; color: var(--ink-2); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--red); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ai-item { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 10px; }
.ai-item + .ai-item { border-top: 1px solid var(--line); }
.ai-item .grow { flex: 1; min-width: 0; }
.ai-item .title { font-weight: 650; }
.ai-item .meta { font-size: 12.5px; color: var(--ink-2); }
.ai-item .ai-k { font-size: 13px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.ai-item.off .grow, .ai-item.off .ai-g { opacity: .45; }
.ai-check { width: 32px; height: 32px; border-radius: 10px; background: var(--surface-2); color: transparent; display: grid; place-items: center; flex: none; }
.ai-check svg { width: 18px; height: 18px; }
.ai-check.on { background: var(--green); color: #fff; }
.ai-g { display: flex; align-items: center; gap: 4px; flex: none; }
.ai-g .input { width: 72px; height: 42px; text-align: center; font-weight: 700; padding: 0 6px; }
.ai-g span { font-size: 13px; color: var(--ink-2); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav id="tabbar" aria-label="Sections"></nav>
  <div id="sheets"></div>
  <div id="toasts"></div>
  <input type="file" id="camIn" accept="image/*" capture="environment" class="hidden" aria-hidden="true" tabindex="-1">
  <input type="file" id="picIn" accept="image/*" class="hidden" aria-hidden="true" tabindex="-1">
  <div id="err" role="alert"><span class="msg"></span><button type="button" onclick="location.reload()">Reload</button></div>
</div>
<script src="data.js?v=1.2.0"></script>
<script src="app.js?v=1.2.0"></script>
</body>
</html>
